<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Диагностика вьюпорта — Muscle Tribe</title>
<style>
 body{margin:0;padding:16px;font:16px/1.5 Arial,sans-serif;background:#fff;color:#191919}
 h1{font-size:20px;margin:0 0 12px}
 table{border-collapse:collapse;width:100%;margin-bottom:20px}
 td{border:1px solid #ddd;padding:8px;font-size:15px}
 td:first-child{width:45%;color:#757575}
 .box{width:100vw;max-width:100%;height:60px;background:#e2602f;color:#fff;display:flex;align-items:center;padding:0 10px;box-sizing:border-box;margin-bottom:8px}
 .box2{width:100%;height:60px;background:#1b3668;color:#fff;display:flex;align-items:center;padding:0 10px;box-sizing:border-box}
 b{font-size:22px}
</style>
</head>
<body>
<h1>Диагностика экрана</h1>
<table id="t"></table>
<div class="box">100vw</div>
<div class="box2">100%</div>
<p>Оба прямоугольника должны быть одинаковой ширины и во всю ширину экрана.</p>
<script>
var vv = window.visualViewport || {};
var rows = [
 ['window.innerWidth', window.innerWidth],
 ['documentElement.clientWidth', document.documentElement.clientWidth],
 ['body.clientWidth', document.body.clientWidth],
 ['visualViewport.width', vv.width],
 ['visualViewport.scale', vv.scale],
 ['devicePixelRatio', window.devicePixelRatio],
 ['screen.width', screen.width],
 ['meta viewport', (document.querySelector('meta[name=viewport]')||{}).content || 'НЕТ'],
 ['userAgent', navigator.userAgent.slice(0,110)]
];
document.getElementById('t').innerHTML = rows.map(function(r){
 return '<tr><td>'+r[0]+'</td><td><b>'+r[1]+'</b></td></tr>';
}).join('');
</script>
</body>
</html>
